# Fly.io deployment of the FirstTouch Agent.
#
#   fly launch --no-deploy         # create the app from this file
#   fly secrets set SLACK_BOT_TOKEN=… SLACK_APP_TOKEN=… CLAUDE_CODE_OAUTH_TOKEN=… FT_MCP_TOKEN=…
#   fly volumes create agent_data --size 1
#   fly deploy
#   fly logs                       # watch for the claim code, then DM the bot
#
# The host is a single always-on process. It opens NO port — it dials out to
# Slack over Socket Mode — so there is no [http_service] here on purpose.

app = "firsttouch-agent"

[build]
  dockerfile = "Dockerfile"

[env]
  AGENT_CONFIG = "agent"
  STATE_DIR = "/data/state"
  CONFIG_DIR = "/data/config"
  TZ = "America/New_York"

# Fly volumes are single-attach: one volume, one machine. Keep this app at one
# machine (`fly scale count 1`) or the second machine gets no state and the
# ledger diverges — and two hosts would split Slack clicks.
[mounts]
  source = "agent_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
