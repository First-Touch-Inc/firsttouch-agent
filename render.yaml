# Render Blueprint — the always-on FirstTouch Agent.
#
# The agent is a long-running host (Slack Socket Mode, self-scheduling), not a
# cron job, so this is a `worker` service with a persistent disk. It opens no
# port, so it is a worker, not a web service.
#
#   Render dashboard → New → Blueprint → point at this repo.
#   Set the secrets below when prompted, deploy, then watch the logs for the
#   claim code and DM the bot.

services:
  - type: worker
    name: firsttouch-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # (no dockerCommand — the image's CMD runs the host)

    region: oregon
    # plan: starter          # check current plan names at render.com/pricing

    disk:
      name: agent-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: AGENT_CONFIG
        value: agent
      - key: STATE_DIR
        value: /data/state
      - key: CONFIG_DIR
        value: /data/config

      # sync: false means "prompt me in the dashboard, do not store in git".
      # Never put a real secret in this file. Set exactly one model credential.
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: FT_MCP_TOKEN
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
