# The agent's configuration. Copy to config/agent.yaml — or let the agent
# write this itself during onboarding (both paths run the SAME validation;
# onboarding cannot produce a config that hand-editing would reject).
#
# Rules that apply to this whole file:
#   - No silent defaults for anything tenant-specific. A placeholder that is
#     still a placeholder is a startup error, not a warning.
#   - <angle-bracket> values are placeholders and are rejected as-is.
#   - Slack ids are the raw U…/C… forms, never display names.

client:
  name: "<Your Company>"
  timezone: "America/New_York"       # IANA name; schedules below run in this zone

# Who you sell to — and, just as important, who is NOT a fit. The agent quotes
# this back during onboarding and pushes for exclusions.
icp: |
  <Describe your ideal customer. Include who is NOT a fit — the exclusions do
  more work than the inclusions.>

voice_pack: config/voice-pack.md      # written by onboarding; lessons override it

# supervised: every run is capped small and ends in a digest for review.
# daily: normal operation. Onboarding always starts supervised.
run_mode: supervised

providers:
  outreach:
    kind: firsttouch                  # the only implemented outreach adapter
  crm:
    kind: hubspot
    # How the agent recognises an existing customer so it never prospects one.
    # There is no safe default — these are properties from YOUR CRM.
    customer_signal:
      - property: "<lifecyclestage>"
        equals: "<customer>"

# ---------------------------------------------------------------------------
# Motions: the jobs this agent does. Enable any subset; each runs on its own
# schedule. Turning one on later is a chat exchange, not a redeploy.
# `kind` must be one of: outbound | inbound | deal_followup | cs_postclose
# ---------------------------------------------------------------------------
motions:
  - id: outbound
    kind: outbound
    enabled: true
    schedule: "0 8 * * 1-5"           # cron, client.timezone
    play: outbound-daily              # from the play catalogue (see extra_plays)
    daily_cap: 3                      # drafts per run; floor is opportunity, never quota
    allow_open_deals: false           # true only if this motion manages pipeline
    sources:                          # swept warmest-first, in this order
      - type: social.engagers
      - type: site.visitors
      - type: crm.list
        list_id: "<hubspot list id>"

  - id: inbound
    kind: inbound
    enabled: false
    schedule: "*/30 8-18 * * 1-5"     # triage sweeps run more often, cheaply
    play: inbound-triage
    sources:
      - type: crm.list                # the hand-raise list(s): form fills, signups
        list_id: "<hubspot list id>"

  - id: deal-followup
    kind: deal_followup
    enabled: false
    schedule: "0 11 * * 1-5"
    evening_schedule: "0 18 * * 1-5"  # meeting recaps: unsent drafts, evening
    play: deal-desk
    pipeline_id: "<hubspot pipeline id>"
    stall_days: 10                    # untouched this long = stalled
    # The ONLY CRM properties this motion may propose changing, shown on the
    # card as from → to. Anything not listed here cannot even be proposed.
    crm_fields_may_change: [dealstage, closedate]

  - id: cs-postclose
    kind: cs_postclose
    enabled: false
    schedule: "0 10 * * 1-5"
    play: cs-checkins
    owner_match: cs_account_owner     # cards route to the account's CS owner
    dashboard:
      base_url: "<https://your-cs-dashboard/api>"
      identity: "<expected service identity string>"   # asserted, not just liveness

# ---------------------------------------------------------------------------
# Approvals. The card offers: Approve (whole) / Edit & approve (copy only) /
# Deny (reason required). Approvals get an undo window; denials are instant.
# ---------------------------------------------------------------------------
approval:
  channel: "<C…>"                     # where cards land by default
  undo_seconds: 45
  expiry_hours: 72                    # unactioned cards expire UNAPPLIED

approval_routing:
  owners:
    - id: primary
      name: "<Ada Example>"
      provider_user_id: "<usr_…>"     # WHOSE ACCOUNT messages send from
      slack_user_id: "<U…>"           # who may click approve (self-confirmed by DM)
      match: default                  # exactly one owner has match: default
  approval_overrides: []              # Slack ids who may approve for anyone; empty = nobody

# ---------------------------------------------------------------------------
# Hard limits, enforced in code against the ledger — not instructions.
# A denied card gives its reservation back; nothing here is advisory.
# ---------------------------------------------------------------------------
limits:
  per_day: 25                        # outward touches, all motions combined
  per_week: 100
  per_contact_per_quarter: 2
  per_company_per_quarter: 4
  enrichment_credits_per_run: 20

dedupe:
  rework_cooldown_days: 90            # a denied/ignored prospect rests this long

# The agent recognises an existing customer via providers.crm.customer_signal,
# and additionally never contacts anything matching these. Domain entries are
# the backstop that catches people with no CRM record.
suppression:
  - crm_customer_signal
  - do_not_contact_file               # config/do-not-contact.txt, operator-owned
excluded_domains: []                  # e.g. [competitor.com]

# ---------------------------------------------------------------------------
# Flows the agent may enrol contacts into. THE ALLOWLIST IS THE PERMISSION:
# enrolling into any flow not listed here is refused in code. Empty = none.
# One-off campaigns authored in chat are approved per-campaign instead.
# ---------------------------------------------------------------------------
flows: []
#  - id: "<flow id>"
#    name: "<what it does — shown on cards>"

# ---------------------------------------------------------------------------
# Chat: the always-on conversational surface, and one-off campaigns.
# ---------------------------------------------------------------------------
chat:
  enabled: true
  allowed_users: []                   # Slack user ids; empty list = NOBODY, refuses to start
  allowed_channels: []                # channel ids it answers in (DMs always work for allowed users)
  campaigns_enabled: true             # "email everyone from closed-lost…" → one batch card

slack:
  operator: "<U…>"                    # bound by claim code at first boot; onboarding cannot change it

extra_plays: config/plays             # a DIRECTORY: drop .md plays in, no fork needed

state:
  ledger: state/ledger.db             # the SQLite ledger (identity, decisions, caps, lessons)
