# Local and single-VPS self-hosting.
#
#   cp .env.example .env      # fill it in (Slack + model + FirstTouch tokens)
#   docker compose up -d      # start the always-on host
#   docker compose logs -f    # watch for the claim code, then DM the bot
#
# There are no `ports:` here. The host exposes nothing to the network — it
# dials OUT to Slack, your CRM and FirstTouch. Nothing reaches in.

services:
  host:
    build: .
    image: firsttouch-agent
    env_file: .env
    environment:
      STATE_DIR: /data/state
      CONFIG_DIR: /data/config
      TZ: ${TZ:-UTC}
    volumes:
      # One writable volume holds config, plays, voice pack and the ledger.
      # The agent owns this world; the engine in the image is read-only to it.
      - agent-data:/data
      # Optional: keep the operator-owned do-not-contact list OUTSIDE the
      # agent-writable config, read-only, so the agent can neither read nor
      # edit the list of people who objected.
      # - ./do-not-contact.txt:/etc/agent/do-not-contact.txt:ro
    # Seed config into /data on first boot (see seed note in the README's
    # overlay pattern); a fresh volume starts empty and the bot onboards you.
    restart: unless-stopped

volumes:
  agent-data:
