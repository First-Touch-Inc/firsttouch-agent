# The Slack app, as one pasteable manifest.
#
#   1. https://api.slack.com/apps → Create New App → "From a manifest"
#   2. Pick your workspace, paste this whole file, Create.
#   3. Install App → Install to Workspace → copy the Bot Token (xoxb-…).
#   4. Basic Information → App-Level Tokens → Generate Token and Scopes →
#      add `connections:write` → copy the App Token (xapp-…).
#      [The manifest cannot mint this one — it is the single manual token step.]
#
# Socket Mode means the agent DIALS OUT to Slack: no request URL, no public
# endpoint, no inbound firewall rule. The interactivity block needs no URL for
# the same reason — approval button clicks arrive over the same socket.
#
# The scope set matches what FirstTouch's own internal agents run with. The
# ones that are easy to under-provision:
#   - messages_tab_enabled: without it Slack BLOCKS DMs to the app entirely.
#   - files:read: Slack file URLs are private; without this scope Slack serves
#     a login page instead of the screenshot you sent.
#   - channels:history / groups:history: without these the app never hears
#     replies in approval-card threads, so feedback silently goes nowhere.
#   - users:read.email: how the agent maps the person talking to their
#     FirstTouch seat and HubSpot owner — who to send outreach from.

display_information:
  name: FirstTouch Agent
  description: Works your pipeline daily and asks before anything sends.
  background_color: "#22633F"

features:
  bot_user:
    display_name: firsttouch-agent
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read    # @firsttouch-agent in channels
      - channels:history     # hear replies in public-channel card threads
      - channels:read        # resolve channel names/ids
      - chat:write           # post cards, reports, replies
      - chat:write.customize # per-message persona name/avatar
      - files:read           # read screenshots people attach
      - groups:history       # hear replies in private-channel card threads
      - groups:read
      - im:history           # DMs: the main conversation surface
      - im:read
      - im:write
      - mpim:history         # group DMs
      - mpim:read
      - reactions:read
      - reactions:write      # the 👀 acknowledgement
      - users:read           # who is talking
      - users:read.email     # …and which FirstTouch/HubSpot user they are

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
